[package]
name = "rullst-connect"
version = "10.0.1"
edition = "2024"
description = "OAuth2 Social Login for Rust web frameworks."
license = "MIT"
repository = "https://github.com/venelouis/rullst-connect"
categories = ["web-programming", "authentication"]
keywords = ["oauth2", "connect", "authentication", "login"]

[features]
default = []
axum = ["dep:axum"]
actix = ["dep:actix-web"]
leptos = ["dep:leptos_router"]
rullst = ["axum"]
retry = ["dep:reqwest-middleware", "dep:reqwest-retry"]
reqwest-middleware = ["dep:reqwest-middleware"]
axum-session = ["axum", "dep:tower-sessions"]
mock = []

[dependencies]
async-trait = "0.1"
base64 = "0.22"
jsonwebtoken = "10"
rand = "0.10"
reqwest = { version = "0.13", features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5"

axum = { version = "0.8", optional = true }
actix-web = { version = "4", optional = true }
leptos_router = { version = "0.8", optional = true }
serde_urlencoded = "0.7"
reqwest-middleware = { version = "0.5", optional = true }
reqwest-retry = { version = "0.9", optional = true }
tower-sessions = { version = "0.15", optional = true }
subtle = "2.6.1"
secrecy = { version = "0.10", features = ["serde"] }

[package.metadata.cargo-machete]
ignored = ["leptos_router"]

[dev-dependencies]
axum = "0.8"
actix-web = "4"
serde_urlencoded = "0.7"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"
loom = "0.7"

[[bench]]
name = "provider_bench"
harness = false

[[example]]
name = "axum_example"
required-features = ["axum"]
