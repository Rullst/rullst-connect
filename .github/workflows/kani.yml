name: Kani Rust Verifier

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  kani:
    name: Run Kani Proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify with Kani
        uses: model-checking/kani-github-action@v1
        with:
          args: --tests
        continue-on-error: true # Continues if no proofs exist yet
